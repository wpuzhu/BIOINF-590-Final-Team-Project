# Stage 1 real-data configuration (cross-modal pretraining transfer).
labels_per_class: [5, 20, 100, all]
folds: 5
seeds: [0, 1, 2, 3, 4]
marker_gene_map_json: $SCRATCH/harmonised/marker_gene_map.json   # {marker: gene}, from datasets/marker_gene_map.csv

datasets:
  # target, modality available
  spatch_colon_xenium5k:   {path: $SCRATCH/harmonised/spatch_colon_xenium5k.h5ad,   modalities: [rna]}
  spatch_colon_codex:      {path: $SCRATCH/harmonised/spatch_colon_codex.h5ad,      modalities: [protein]}
  spatch_liver_xenium5k:   {path: $SCRATCH/harmonised/spatch_liver_xenium5k.h5ad,   modalities: [rna]}
  spatch_liver_codex:      {path: $SCRATCH/harmonised/spatch_liver_codex.h5ad,      modalities: [protein]}
  schurch_crc_codex:       {path: $SCRATCH/harmonised/schurch_crc_codex.h5ad,       modalities: [protein]}
  cosmx_multiomic_nsclc:   {path: $SCRATCH/harmonised/cosmx_multiomic_nsclc.h5ad,   modalities: [rna, protein]}
  xenium_protein_rcc:      {path: $SCRATCH/harmonised/xenium_protein_rcc.h5ad,      modalities: [rna, protein]}

models:
  pca: {n_pcs: 50}
  nicheformer:
    hf_id: theislab/Nicheformer      # VERIFY the current Hugging Face id (docs also show aletlvl/Nicheformer)
    max_len: 1500
    context_token_ids: []            # VERIFY: modality / organism / assay token ids from the tokenizer
  spatium:
    protein_vocab: $SCRATCH/models/spatium/protein_id_map.npy   # VERIFY path from the Spatium release

finetune: {epochs: 10, lr: 1.0e-4, batch: 128}

grid:            # expanded by cluster/make_jobs.py
  models: [pca, nicheformer, spatium]
  arms: [pretrained, scratch, A1_reinit, A2_random_map, A3_overlap]
  a3_q: [0.25, 0.5, 0.75]
  modes: [frozen, finetune]
  # pca runs only arm=pretrained, mode=frozen; spatium on rna and nicheformer on protein are the
  # cross-modal cells
